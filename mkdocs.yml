site_name: AI 활용 교육
site_description: 비개발자를 위한 AI 활용 교육 사이트
site_url: ""

theme:
  name: material
  language: ko
  custom_dir: overrides
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: 다크 모드로 전환
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: 라이트 모드로 전환
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: ko

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - attr_list
  - md_in_html
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - toc:
      permalink: true

extra_css:
  - assets/css/claude-theme.css
  - assets/css/slide-link.css

nav:
  - 홈: index.md
  - 1부 ― AI 활용 기본:
      - 기본 용어와 범위: basics.md
      - 도구와 제품: intro.md
      - 실습: labs.md
  - 2부 ― 도구·데이터 연결:
      - 개요 ― 연결이 왜 필요한가: connect/index.md
      - 기본 커넥터 ― Atlassian·GitHub: connect/connectors.md
      - MCP 서버 이용하기: connect/mcp-servers.md
  - 보안 및 개인정보 가이드: security-guide.md
  - 교육 운영 가이드: operation-guide.md
