<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>날씨 아이콘 9종 미리보기</title>
<link rel="stylesheet" as="style" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: #E9EAEE;
    color: #1A1D22;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding: 2rem 1rem;
  }
  .page { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.4rem; letter-spacing: -0.02em; }
  .lead { font-size: 0.875rem; color: #6b7280; margin-bottom: 1.75rem; }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1rem;
  }
  .item {
    display: flex; flex-direction: column; align-items: center; gap: 0.625rem;
  }
  .badge {
    width: 100%; aspect-ratio: 1 / 1;
    border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px rgba(26,29,34,0.10), 0 2px 6px rgba(26,29,34,0.06);
  }
  .badge svg { width: 60%; height: 60%; }
  .badge[data-weather="맑음"]     { background: linear-gradient(165deg, #2D6FB5 0%, #4F9CD9 60%, #6FB3E5 100%); }
  .badge[data-weather="구름조금"] { background: linear-gradient(165deg, #3D7BBA 0%, #6BA8DC 60%, #92BCE2 100%); }
  .badge[data-weather="구름많음"] { background: linear-gradient(165deg, #4F6F8E 0%, #7088A6 60%, #9DAEC2 100%); }
  .badge[data-weather="흐림"]     { background: linear-gradient(165deg, #5C6E83 0%, #788EA5 60%, #A6B7CA 100%); }
  .badge[data-weather="비"]       { background: linear-gradient(165deg, #34465B 0%, #5B6E83 60%, #8194A8 100%); }
  .badge[data-weather="소나기"]   { background: linear-gradient(165deg, #3E5570 0%, #647B96 60%, #8C9FB5 100%); }
  .badge[data-weather="천둥번개"] { background: linear-gradient(165deg, #2A3445 0%, #485267 60%, #6E7A8E 100%); }
  .badge[data-weather="눈"]       { background: linear-gradient(165deg, #46586E 0%, #788A9F 60%, #A6B6C8 100%); }
  .badge[data-weather="안개"]     { background: linear-gradient(165deg, #6B7480 0%, #97A0AC 60%, #BEC5CE 100%); }
  .label { font-size: 0.95rem; font-weight: 600; letter-spacing: -0.02em; }
  @media (max-width: 480px) { .grid { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<div class="page">
  <h1>날씨 아이콘 9종</h1>
  <p class="lead"><code>{{weather_state}}</code> 슬롯에 들어올 수 있는 9가지 값과 매칭되는 hero 그라데이션·아이콘 미리보기입니다.</p>

  <div class="grid">
    <div class="item">
      <div class="badge" data-weather="맑음">
        <svg viewBox="0 0 120 120" fill="none">
          <circle cx="60" cy="60" r="36" fill="#FFE17A" opacity="0.25"/>
          <circle cx="60" cy="60" r="26" fill="#FFE17A"/>
          <line x1="60" y1="18" x2="60" y2="6" stroke="#FFD23E" stroke-width="4" stroke-linecap="round"/>
          <line x1="60" y1="114" x2="60" y2="102" stroke="#FFD23E" stroke-width="4" stroke-linecap="round"/>
          <line x1="18" y1="60" x2="6" y2="60" stroke="#FFD23E" stroke-width="4" stroke-linecap="round"/>
          <line x1="114" y1="60" x2="102" y2="60" stroke="#FFD23E" stroke-width="4" stroke-linecap="round"/>
          <line x1="30" y1="30" x2="22" y2="22" stroke="#FFD23E" stroke-width="4" stroke-linecap="round"/>
          <line x1="98" y1="98" x2="90" y2="90" stroke="#FFD23E" stroke-width="4" stroke-linecap="round"/>
          <line x1="30" y1="90" x2="22" y2="98" stroke="#FFD23E" stroke-width="4" stroke-linecap="round"/>
          <line x1="98" y1="22" x2="90" y2="30" stroke="#FFD23E" stroke-width="4" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="label">맑음</div>
    </div>

    <div class="item">
      <div class="badge" data-weather="구름조금">
        <svg viewBox="0 0 120 120" fill="none">
          <circle cx="46" cy="46" r="22" fill="#FFE17A" opacity="0.3"/>
          <circle cx="46" cy="46" r="16" fill="#FFE17A"/>
          <path fill="#E8EDF3" d="M92 92H46a14 14 0 01-1.5-27.9A18 18 0 0182 60a12 12 0 0110 32z"/>
        </svg>
      </div>
      <div class="label">구름조금</div>
    </div>

    <div class="item">
      <div class="badge" data-weather="구름많음">
        <svg viewBox="0 0 120 120" fill="none">
          <circle cx="36" cy="34" r="18" fill="#FFE17A" opacity="0.3"/>
          <circle cx="36" cy="34" r="13" fill="#FFE17A"/>
          <path fill="#D6DDE5" d="M88 90H38a16 16 0 01-2-31.9A20 20 0 0178 56a14 14 0 0110 34z"/>
        </svg>
      </div>
      <div class="label">구름많음</div>
    </div>

    <div class="item">
      <div class="badge" data-weather="흐림">
        <svg viewBox="0 0 120 120" fill="none">
          <path fill="#D6DDE5" d="M86 86H34a16 16 0 01-2-31.9A20 20 0 0176 50a14 14 0 0110 36z"/>
        </svg>
      </div>
      <div class="label">흐림</div>
    </div>

    <div class="item">
      <div class="badge" data-weather="비">
        <svg viewBox="0 0 120 120" fill="none">
          <path fill="#B7C2CD" d="M86 70H34a16 16 0 01-2-31.9A20 20 0 0176 32a14 14 0 0110 38z"/>
          <line x1="42" y1="80" x2="38" y2="98" stroke="#5C9DD8" stroke-width="4" stroke-linecap="round"/>
          <line x1="60" y1="80" x2="56" y2="98" stroke="#5C9DD8" stroke-width="4" stroke-linecap="round"/>
          <line x1="78" y1="80" x2="74" y2="98" stroke="#5C9DD8" stroke-width="4" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="label">비</div>
    </div>

    <div class="item">
      <div class="badge" data-weather="소나기">
        <svg viewBox="0 0 120 120" fill="none">
          <path fill="#A7B4C2" d="M86 64H34a16 16 0 01-2-31.9A20 20 0 0176 26a14 14 0 0110 38z"/>
          <g stroke="#3D7BBA" stroke-width="5" stroke-linecap="round">
            <line x1="40" y1="76" x2="34" y2="100"/>
            <line x1="56" y1="76" x2="50" y2="100"/>
            <line x1="72" y1="76" x2="66" y2="100"/>
            <line x1="88" y1="76" x2="82" y2="100"/>
          </g>
        </svg>
      </div>
      <div class="label">소나기</div>
    </div>

    <div class="item">
      <div class="badge" data-weather="천둥번개">
        <svg viewBox="0 0 120 120" fill="none">
          <path fill="#9CA8B5" d="M86 60H34a16 16 0 01-2-31.9A20 20 0 0176 22a14 14 0 0110 38z"/>
          <path fill="#FFD23E" d="M58 64 l-12 22 l9 0 l-6 16 l16 -24 l-9 0 l8 -14z"/>
          <circle cx="82" cy="86" r="3" fill="#FFD23E"/>
        </svg>
      </div>
      <div class="label">천둥번개</div>
    </div>

    <div class="item">
      <div class="badge" data-weather="눈">
        <svg viewBox="0 0 120 120" fill="none">
          <path fill="#C7D1DD" d="M86 64H34a16 16 0 01-2-31.9A20 20 0 0176 26a14 14 0 0110 38z"/>
          <g stroke="#9DB7CC" stroke-width="2" stroke-linecap="round" fill="none">
            <path d="M40 80v18 M33 84l14 10 M33 94l14-10"/>
            <path d="M60 84v18 M53 88l14 10 M53 98l14-10"/>
            <path d="M80 80v18 M73 84l14 10 M73 94l14-10"/>
          </g>
        </svg>
      </div>
      <div class="label">눈</div>
    </div>

    <div class="item">
      <div class="badge" data-weather="안개">
        <svg viewBox="0 0 120 120" fill="none">
          <rect x="22" y="40" width="76" height="6" rx="3" fill="#fff" opacity="0.9"/>
          <rect x="32" y="56" width="66" height="6" rx="3" fill="#fff" opacity="0.7"/>
          <rect x="22" y="72" width="76" height="6" rx="3" fill="#fff" opacity="0.9"/>
          <rect x="38" y="88" width="56" height="6" rx="3" fill="#fff" opacity="0.7"/>
        </svg>
      </div>
      <div class="label">안개</div>
    </div>
  </div>
</div>
</body>
</html>
